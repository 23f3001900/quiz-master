{% extends 'layout.html' %} {% block title %}Add Chapter{% endblock %} {% block
content %}
<div class="add-subject-container">
  <h1 class="text-center text-primary">Add Chapter</h1>
  <div class="form-card">
    <form action="" method="post" class="form">
      <div class="form-group">
        <label for="name" class="form-label">Chapter Name: </label>
        <input
          type="text"
          class="form-control"
          id="name"
          name="name"
          required
        />
      </div>
      <div class="form-group">
        <label for="description" class="form-label">Description: </label>
        <textarea
          class="form-control"
          id="description"
          name="description"
          required
        ></textarea>
      </div>
      <br />
      <div class="form-group">
        <button type="submit" class="btn btn-success">
          <i class="fas fa-plus"></i> Add
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
{% block style %}
  <style>
    /* Container Styling */
    .add-subject-container {
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      text-align: center;
    }

    /* Card Styling */
    .form-card {
      background: #ffffff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: rgba(0, 0, 0, 0.1) 0px 4px 12px;
    }

    /* Heading Styling */
    .text-primary {
      font-size: 28px;
      font-weight: bold;
    }

    /* Form Control Styling */
    .form-control {
      border-radius: 5px;
      border: 1px solid #ced4da;
      font-size: 16px;
      padding: 10px;
      transition: 0.3s ease-in-out;
    }

    .form-control:focus {
      border-color: #007bff;
      box-shadow: 0px 0px 5px rgba(0, 123, 255, 0.2);
    }

    /* Label Styling */
    .form-label {
      font-weight: bold;
      color: #495057;
    }

    /* Button Styling */
    .btn-success {
      background-color: #28a745;
      padding: 12px 25px;
      font-size: 18px;
      border-radius: 8px;
      transition: 0.3s ease;
    }

    .btn-success:hover {
      background-color: #218838;
      transform: scale(1.05);
    }
  </style>
  {% endblock %}
</div>

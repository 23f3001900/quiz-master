{% extends 'layout.html' %} {% block title %}Edit Quiz{% endblock %} {% block
content %}
<div class="edit-subject-container">
  <h1 class="text-primary text-center mb-4">Edit Quiz</h1>
  <form action="" method="post" class="form">
    <div class="form-group">
      <!-- Date Field -->
      <label for="date" class="form-label">Date: </label>
      <input
        type="date"
        class="form-control"
        id="date"
        name="date"
        value="{{ quiz.quiz_date }}"
        required
      />
    </div>

    <div class="form-group">
      <!-- Duration Field -->
      <label for="duration" class="form-label">Duration (in hours): </label>
      <input
        type="number"
        class="form-control"
        id="duration"
        name="duration"
        value="{{ quiz.quiz_duration.hour }}"
        min="1"
        required
      />
    </div>

    <div class="form-group">
      <!-- Remarks Field -->
      <label for="remarks" class="form-label">Remarks: </label>
      <textarea
        class="form-control"
        id="remarks"
        name="remarks"
        placeholder="Add any additional notes here"
      >
{{ quiz.remarks }}</textarea
      >
    </div>

    <br />
    <div class="form-group">
      <!-- Submit Button -->
      <button type="submit" class="btn btn-success">
        <i class="fas fa-save"></i> Update
      </button>
    </div>
  </form>
</div>
{% endblock %} {% block style %}
<style>
  /* Center the Form */
  .edit-subject-container {
    max-width: 600px;
    margin: 40px auto;
    padding: 30px;
    background: #ffffff;
    border-radius: 10px;
    box-shadow: rgba(0, 0, 0, 0.1) 0px 4px 12px;
  }

  /* Heading */
  .text-primary {
    font-size: 28px;
    font-weight: bold;
  }

  /* Form Styling */
  .form-group {
    margin-bottom: 15px;
  }

  .form-label {
    font-weight: bold;
    color: #333;
  }

  .form-control {
    border-radius: 8px;
    border: 1px solid #ced4da;
    padding: 10px;
    font-size: 16px;
  }

  /* Button Styling */
  .btn-success {
    background-color: #28a745;
    padding: 10px 20px;
    font-size: 18px;
    border-radius: 8px;
    transition: 0.3s ease;
  }

  .btn-success:hover {
    background-color: #218838;
    transform: scale(1.05);
  }
</style>
{% endblock %}

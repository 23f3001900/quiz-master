{% extends 'layout.html' %} {% block title %}Delete Subject{% endblock %} {%
block content %}
<div class="delete-subject-container">
  <h1 class="text-danger text-center">Delete Subject</h1>
  <br />
  <p class="text-center text-muted">
    Are you sure you want to delete this subject?
  </p>
  <div class="subject-card">
    <h4 class="text-center">Subject Name: {{ subject.name }}</h4>
    <br />
    <form action="" method="post" class="form">
      <button type="submit" class="btn btn-danger btn-lg">
        <i class="fas fa-trash-alt"></i> Delete
      </button>
    </form>
  </div>
</div>
{% endblock %} {% block style %}
<style>
  /* Centered Delete Page */
  .delete-subject-container {
    max-width: 500px;
    margin: 50px auto;
    padding: 30px;
    background: #ffffff;
    border-radius: 10px;
    box-shadow: rgba(0, 0, 0, 0.1) 0px 4px 12px;
    text-align: center;
  }

  /* Title Styling */
  .text-danger {
    font-size: 28px;
    font-weight: bold;
  }

  /* Confirmation Message */
  .text-muted {
    font-size: 18px;
    margin-bottom: 20px;
  }

  /* Subject Name Card */
  .subject-card {
    background: #f8f9fa;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 20px;
    box-shadow: rgba(0, 0, 0, 0.05) 0px 2px 6px;
  }

  /* Delete Button */
  .btn-danger {
    background-color: #dc3545;
    padding: 12px 25px;
    font-size: 18px;
    border-radius: 8px;
    transition: 0.3s ease;
  }

  .btn-danger:hover {
    background-color: #c82333;
    transform: scale(1.05);
  }
</style>
{% endblock %}

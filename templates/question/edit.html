{% extends 'layout.html' %} {% block title %}Edit Question{% endblock %} {%
block content %}
<div class="edit-subject-container">
  <h1 class="text-primary text-center mb-4">Edit Question</h1>
  <form action="" method="post" class="form">
    <div class="form-group">
      <label for="statement" class="form-label">Question Statement: </label>
      <textarea class="form-control" id="statement" name="statement"></textarea>
    </div>

    <div class="form-group">
      <label for="option1" class="form-label">Option 1:</label>
      <input
        class="form-control"
        type="text"
        id="option1"
        name="option1"
        placeholder="Enter Option 1"
      />
    </div>

    <div class="form-group">
      <label for="option2" class="form-label">Option 2:</label>
      <input
        class="form-control"
        type="text"
        id="option2"
        name="option2"
        placeholder="Enter Option 2"
      />
    </div>

    <div class="form-group">
      <label for="option3" class="form-label">Option 3:</label>
      <input
        class="form-control"
        type="text"
        id="option3"
        name="option3"
        placeholder="Enter Option 3"
      />
    </div>

    <div class="form-group">
      <label for="option4" class="form-label">Option 4:</label>
      <input
        class="form-control"
        type="text"
        id="option4"
        name="option4"
        placeholder="Enter Option 4"
      />
    </div>

    <div class="form-group">
      <label for="correct_option" class="form-label">Correct Option:</label>
      <select class="form-control" id="correct_option" name="correct_option">
        <option value="1">Option 1</option>
        <option value="2">Option 2</option>
        <option value="3">Option 3</option>
        <option value="4">Option 4</option>
      </select>
    </div>
    <br />
    <div class="form-group">
      <button type="submit" class="btn btn-success">
        <i class="fas fa-save"></i> Update
      </button>
    </div>
  </form>
</div>
{% endblock %} {% block style %}
<style>
  /* Center the Form */
  .edit-subject-container {
    max-width: 600px;
    margin: 40px auto;
    padding: 30px;
    background: #ffffff;
    border-radius: 10px;
    box-shadow: rgba(0, 0, 0, 0.1) 0px 4px 12px;
  }

  /* Heading */
  .text-primary {
    font-size: 28px;
    font-weight: bold;
  }

  /* Form Styling */
  .form-group {
    margin-bottom: 15px;
  }

  .form-label {
    font-weight: bold;
    color: #333;
  }

  .form-control {
    border-radius: 8px;
    border: 1px solid #ced4da;
    padding: 10px;
    font-size: 16px;
  }

  /* Button Styling */
  .btn-success {
    background-color: #28a745;
    padding: 10px 20px;
    font-size: 18px;
    border-radius: 8px;
    transition: 0.3s ease;
  }

  .btn-success:hover {
    background-color: #218838;
    transform: scale(1.05);
  }
</style>
{% endblock %}

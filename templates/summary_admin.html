{% extends 'layout.html' %} {% block title %}Scores{% endblock %} {% block
content %}<br />
<h2 class="display-2 text-primary text-center mb-4">Summary:</h2>
<br />
<h3 class="display-3 text-secondary text-center mb-4">Top Scores:</h3>
<div class="chart-container">
  <canvas id="myChart" width="200" height="100"></canvas>
</div>

{% endblock %}{% block style %}
<style>
  body {
    background-color: #f8f9fa; /* Light grey background */
  }
  .chart-container {
    width: 80%;
    max-width: 600px;
    margin: auto;
    padding: 20px;
    background-color: #ffffff;
    border-radius: 10px;
    box-shadow: rgba(0, 0, 0, 0.1) 0px 4px 12px;
  }
  #myChart {
    width: 100%;
    height: auto;
  }
  h2.display-2 {
    font-size: 36px;
    color: #007bff;
    font-weight: bold;
  }

  h3.display-3 {
    font-size: 28px;
    color: #6c757d;
    font-weight: normal;
  }
</style>

{%endblock%}{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Add a JSON script to embed Flask data safely -->
<script id="chart-data" type="application/json">
  {
    "labels": {{ subjects | tojson | safe }},
    "data": {{ top_scores | tojson | safe }}
  }
</script>

<script>
  console.log("js code running");

  // Fetch the JSON data from the embedded script tag
  const chartData = JSON.parse(
    document.getElementById("chart-data").textContent
  );

  const labels = chartData.labels; // Extract labels from JSON
  const data = chartData.data; // Extract data from JSON

  console.log("Labels:", labels);
  console.log("Data:", data);

  const ctx = document.getElementById("myChart");

  new Chart(ctx, {
    type: "bar",
    data: {
      labels: labels,
      datasets: [
        {
          label: "Top Scores",
          data: data,
          backgroundColor: [
            "rgba(255, 99, 132, 1)",
            "rgba(54, 162, 235, 1)",
            "rgba(255, 206, 86, 1)",
            "rgba(75, 192, 192, 1)",
            "rgba(153, 102, 255, 1)",
            "rgba(255, 159, 64, 1)",
          ],
          borderWidth: 1,
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        y: {
          beginAtZero: true,
        },
      },
    },
  });
</script>

{% endblock %}
